        return Promise.resolve({ shown: false, reason: 'exception' });
      }
    },

    /**
     * Show an optional rewarded ad for bonus rewards (e.g., bonus XP, cosmetics).
     * Never required for standard gameplay.
     */
    showRewarded: function (placement, onReward) {
      if (!this.isEnabled() || (typeof navigator !== 'undefined' && !navigator.onLine)) {
        // When offline or disabled, optional bonus gracefully resolves false
        return Promise.resolve({ rewarded: false, reason: 'unavailable' });
      }
      try {
        return Promise.resolve(_provider.showRewarded(placement || 'bonus')).then(function (success) {
          if (success && typeof onReward === 'function') {
            try { onReward(); } catch (e) {}
          }
          return { rewarded: !!success };
        }).catch(function () {
          return { rewarded: false, reason: 'error' };
        });
      } catch (e) {
        return Promise.resolve({ rewarded: false, reason: 'exception' });
      }

<script>
/* =========================================================================
   Ludora — game.js
   Match controller: turn flow, fair crypto RNG dice, animation pipeline,
   squash & stretch physics, AI scheduling, pass & play handoff,
   and bulletproof autosave/resume.
   Optimized for 60 FPS mobile-first responsiveness with zero dead time.
   ========================================================================= */
(function (global) {
  'use strict';
  var E = global.LudoraEngine, Board = global.LudoraBoard, AI = global.LudoraAI,
      Audio2 = global.LudoraAudio, Store = global.LudoraStore;

  var G = null; // Active match instance

  /* Fair dice: cryptographic randomness with rejection sampling */
  function rollValue() {
    try {
      var a = new Uint8Array(1);
      for (;;) {
        crypto.getRandomValues(a);
        if (a[0] < 252) return (a[0] % 6) + 1;
      }
    } catch (e) {
      return 1 + Math.floor(Math.random() * 6);
    }
  }

  function Match() {
    this.st = null;           // Engine state
    this.cfg = null;          // {mode, seats, theme, dice, tokenShape, youColor, dailyKey, tutorial}
    this.canvas = null;
    this.ctx = null;
    this.staticCv = null;
    this.m = null;
    this.dpr = 1;
    this.cssS = 0;
    this.view = { anims: [], particles: [], halos: [], targets: [] };
    this.legal = [];          // Current legal moves
    this.running = false;
    this.raf = 0;
    this.lastFrame = 0;
    this.timers = [];
    this.destroyed = false;
    this.lastHumanSeat = -1;
    this.awaitingHandoff = false;
    this.diceBusy = false;
    this.speed = 1;
    this.netHost = null;
    this.netGuest = null;
    this.netSeq = 0;
    this._idleFrame = false;
    this._drawList = [];
    this.reducedMotion = false;
    this.tutorialStep = 0;

    try {
      this.reducedMotion = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {}
    if (this.reducedMotion) this.speed = 0.5;
  }

  Match.prototype.start = function (canvas, cfg, savedState) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cfg = cfg || {};
    if (savedState) {
      this.st = savedState;
      this.migrateResume();
    } else {
      this.st = E.createGame({ mode: cfg.mode, seats: cfg.seats, rules: cfg.rules });
    }

    var settings = (global.LudoraProfile && global.LudoraProfile.loadProfile().settings) || {};
    this.speed = settings.animSpeed === 'fast' ? 1 : 1.35;
    if (this.reducedMotion || settings.reducedMotion) {
      this.reducedMotion = true;
      this.speed = 0.5;
    }

    this.lastBegun = -1;
    this.arrivalPt = null;
    this._loopBound = this.loop.bind(this);
    this.resize(true);
    this.observeBoard();
    this.save();
    this.running = true;
    this.pendingBegin = true;
    this.raf = requestAnimationFrame(this._loopBound);

    if (this.cfg.tutorial) {
      this.tutorialStep = 1;
    }
  };

  Match.prototype.observeBoard = function () {
    if (this.ro || typeof ResizeObserver === 'undefined') return;
    var self = this;
    this.ro = new ResizeObserver(function () {
      if (!self.destroyed) self.resize();
    });
    this.ro.observe(this.canvas.parentElement);
  };

  Match.prototype.begin = function () {
    if (!this.pendingBegin || this.destroyed) return;
    this.pendingBegin = false;
    if (this.st.phase === 'move') this.representMovePhase();
    else this.enterTurn(true);
  };

  Match.prototype.migrateResume = function () {
    if (this.st.phase === 'move') {
      this.legal = E.legalMoves(this.st, this.st.lastRoll || 0);
      if (!this.legal.length) {
        this.st.phase = 'roll';
        this.st.lastRoll = null;
      }
    }
  };

  /* Layout & Hi-DPI Scaling */
  Match.prototype.resize = function (force) {
    this.wake();
    var wrap = this.canvas.parentElement;
    var availW, availH;
    if (wrap && wrap.clientWidth > 0 && wrap.clientHeight > 0) {
      availW = wrap.clientWidth - 16;
      availH = wrap.clientHeight - 8;
    } else {
      var iw = global.innerWidth || 360, ih = global.innerHeight || 640;
      availW = Math.min(iw - 32, ih - 210);
      availH = availW;
    }

    var S = Math.max(200, Math.floor(Math.min(availW, availH)));
    if (!force && S === this.cssS && this.m) return;

    this.cssS = S;
    this.dpr = Math.min(global.devicePixelRatio || 1, 2.5);
    this.canvas.style.width = S + 'px';
    this.canvas.style.height = S + 'px';
    this.canvas.width = Math.round(S * this.dpr);
    this.canvas.height = Math.round(S * this.dpr);
    this.m = Board.metrics(S);
    this.rebuildStatic();
  };

  Match.prototype.rebuildStatic = function () {
    var cv = this.staticCv = this.staticCv || document.createElement('canvas');
    cv.width = Math.round(this.cssS * this.dpr);
    cv.height = cv.width;
    var c = cv.getContext('2d');
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    Board.drawStatic(c, this.m, this.cfg.theme || 'ivory');
  };

  Match.prototype.after = function (ms, fn) {
    var self = this;
    var id = setTimeout(function () {
      var i = self.timers.indexOf(id);
      if (i >= 0) self.timers.splice(i, 1);
      if (!self.destroyed) fn();

  };

  Match.prototype.clearTimers = function () {
    this.timers.forEach(clearTimeout);
    this.timers.length = 0;
  };

  Match.prototype.save = function () {

    }

    if (this.st.phase === 'anim') return;
    Store.save(Store.keys.match, {
      v: 1,
      savedAt: Date.now(),
      cfg: this.cfg,
      st: this.st

  /* Turn Flow */
  Match.prototype.enterTurn = function (first) {
    if (this.destroyed || this.st.phase === 'over') return;
    this.wake();
    var seat = this.st.turn;
    var seatInfo = this.st.seats[seat];
    if (seat !== this.lastBegun) {
      E.beginsTurn(this.st);
      this.lastBegun = seat;
    }
    this.legal = [];
    this.view.halos = [];
    this.view.targets = [];
    this.emit('hud');
    this.emit('turn', { seat: seat, seatInfo: seatInfo });

    var needsHandoff = this.needsHandoff(seat);
    if (this.pauseRequested) {
      this.freezeNow();
      return;
    }
    if (needsHandoff) {
      this.awaitingHandoff = true;
      this.emit('handoff', { seat: seat, seatInfo: seatInfo });
      return;
    }
    this.armRoll();
  };

  Match.prototype.freezeNow = function () {
    this.paused = true;
    this.running = false;
    cancelAnimationFrame(this.raf);
    this.save();
  };

  Match.prototype.needsHandoff = function (seat) {
    if (this.cfg.mode === 'online' || this.cfg.tutorial) return false;
    if (this.st.seats.length < 2) return false;
    var humans = this.st.seats.filter(function (s) { return s.kind === 'human'; }).length;
    if (humans < 2) return false;
    var s = this.st.seats[seat];
    if (s.kind !== 'human') return false;
    return seat !== this.lastHumanSeat;
  };

  Match.prototype.ackHandoff = function () {
    if (!this.awaitingHandoff) return;
    this.awaitingHandoff = false;
    this.lastHumanSeat = this.st.turn;
    this.armRoll();
  };

  Match.prototype.armRoll = function () {
    if (this.destroyed || this.st.phase === 'over' || this.paused) return;
    var seat = this.st.turn, s = this.st.seats[seat];
    var self = this;

    if (this.netGuest) {
      if (this.isLocalSeat(seat) && s.kind === 'human') {
        this.emit('dice', { state: 'ready' });
        this.announce('Your turn — tap to roll');
      } else {
        this.emit('dice', { state: 'remote-wait' });
      }
      return;
    }

    if (s.kind === 'human') {
      if (this.seatIsRemote(seat)) {
        if (this.netHost && this.netHost.isSeatLive(seat)) {
          this.emit('dice', { state: 'remote-wait' });
          this.announce('Waiting for ' + s.name);
          return;
        }
        this.emit('dice', { state: 'remote-wait' });
        this.emit('toast', { text: s.name + ' is disconnected — turn skipped', kind: 'info' });
        this.announce(s.name + ' is disconnected, turn skipped');
        this.after(1000, function () { self.endTurnFlow(false); });
        return;
      }
      this.lastHumanSeat = seat;
      this.emit('dice', { state: 'ready' });
      this.announce(this.st.moveNo === 0 ? 'Your turn — tap to roll' : 'Your turn');

      if (this.cfg.tutorial) {
        this.emit('tutorial', { step: 1, text: 'Tap the dice to roll!' });
      }
    } else {
      this.emit('dice', { state: 'ai-wait' });
      this.after(AI.thinkDelay(s.ai), this.doRoll.bind(this));
    }
  };

  Match.prototype.doRoll = function () {
    if (this.destroyed || this.diceBusy || this.st.phase !== 'roll') return;
    this.wake();
    this.diceBusy = true;
    this.legal = [];

    var value;
    if (this.cfg.tutorial) {
      var seq = [6, 4, 6, 2, 6, 5, 1];
      value = seq[(this.st.moveNo) % seq.length] || 6;
    } else {
      value = rollValue();
    }

    var r = E.registerRoll(this.st, value);
    this.emit('dice', { state: 'rolling', value: value });
    Audio2.play('roll');
    Audio2.haptic('roll');

    var self = this;
    this.after(430, function () {
      if (self.destroyed || self.st.phase === 'over') return;
      self.diceBusy = false;
      Audio2.play('land', value);
      Audio2.haptic('land');
      self.announce(self.st.seats[self.st.turn].name + ' rolled ' + value);

      if (r.forfeit) {
        self.emit('toast', { text: 'Three sixes — turn passes', kind: 'info' });
        self.announce('Three sixes — turn passes');
        Audio2.play('noMove');
        Audio2.haptic('noMove');
        self.netSyncHost('rolled', { value: value, outcome: 'forfeit', seat: self.st.turn });
        self.after(520, function () { self.endTurnFlow(false); });
        return;
      }

      if (value === 6) {
        Audio2.play('six');
        Audio2.haptic('six');
      }

      self.legal = E.legalMoves(self.st, value);
      self.st.phase = 'move';
      self.save();

      if (!self.legal.length) {
        self.emit('toast', { text: 'No moves for ' + self.st.seats[self.st.turn].name, kind: 'info' });
        self.announce('No moves for ' + self.st.seats[self.st.turn].name);
        Audio2.play('noMove');
        Audio2.haptic('noMove');
        self.netSyncHost('rolled', { value: value, outcome: 'nomoves', seat: self.st.turn });
        self.after(560, function () { self.endTurnFlow(value === 6); });
        return;
      }

      var seat = self.st.turn, s = self.st.seats[seat];
      var firstLegal = self.legal[0];
      if (self.legal.length === 1) {
        self.view.halos = [firstLegal.token];
        self.emit('hud');
        self.netSyncHost('rolled', { value: value, outcome: 'auto', seat: seat });
        if (self.cfg.tutorial) {
          self.emit('tutorial', { step: 2, text: 'You rolled a ' + value + '! Tap your glowing token to move.' });
        }
        self.after(200, function () {
          if (self.st && self.st.phase === 'move') self.executeMove(firstLegal);
        });
      } else if (s.kind === 'ai') {
        self.emit('hud', { thinking: true });
        self.netSyncHost('rolled', { value: value, outcome: 'auto', seat: seat });
        self.after(AI.thinkDelay(s.ai), function () {
          if (self.st && self.st.phase === 'move') {
            self.executeMove(AI.chooseMove(self.st, seat, value, s.ai));
          }
        });
      } else {
        self.view.halos = self.legal.map(function (mv) { return mv.token; });
        self.view.targets = self.legal.map(function (mv) { return mv; });
        self.emit('dice', { state: 'done', value: value });
        self.emit('hud');
        if (self.cfg.tutorial) {
          self.emit('tutorial', { step: 3, text: 'Choose which token to move.' });
        }
        var mine = self.isLocalSeat(seat);
        self.netSyncHost('rolled', { value: value, outcome: mine ? 'choose' : 'auto', seat: seat });
      }
    });
  };

  Match.prototype.executeMove = function (move) {
    if (this.destroyed || !move || !this.st || (this.st.phase !== 'move' && !this.netGuest)) return;
    this.wake();
    if (this.netGuest) {
      if (this.st.phase === 'move' && this.isLocalSeat(this.st.turn) && move && isToken(move.token)) {
        this.netGuest.requestMove(move.token);
        this.view.halos = [];
        this.view.targets = [];
      }
      return;
    }
    this.view.halos = [];
    this.view.targets = [];
    this.st.phase = 'anim';
    this.arrivalPt = null;
    this.emit('hud');
    var seat = this.st.turn;
    var events = E.applyMove(this.st, move);

    this.netSyncHost('moved', {
      seat: seat,
      move: { token: move.token, from: move.from, to: move.to },
      captures: events.captures,
      home: events.home,
      win: events.win,
      extra: (this.st.lastRoll === 6) || events.captures.length > 0 || events.home

      return;

    E.endTurn(this.st, extra);

    this.emit('hud');

    var maxAi = 0;

    });

    this.emit('end', {
      winner: st.winner,
      rankings: st.rankings,
      seats: st.seats,
      stats: st.stats,
      tokens: st.tokens,
      mode: cfg.mode,
      dailyKey: cfg.dailyKey || null,
      youSeat: youSeat,
      maxAiLevel: maxAi,
      durationS: durationS,
      moveNo: st.moveNo,
      tutorial: !!cfg.tutorial
    });
  };

  Match.prototype.findYouSeat = function () {
    if (this.cfg.mode === 'pass') return null;
    if (this.cfg.mode === 'online' && this.netGuest) return this.cfg.netSeat;
    var self = this;
    var idx = null;
    this.st.seats.forEach(function (s, i) {
      if (s.kind === 'human' && (self.cfg.youColor == null || s.color === self.cfg.youColor)) idx = i;
    });
    return idx;
  };

  /* Move Animation & Landing Squash Physics */
  Match.prototype.animateMove = function (seat, move, events) {
    var self = this;
    var path = events.path;
    var fromPt = this.tokenPoint(seat, move.token, move.from);
    var pts = [fromPt].concat(path.map(function (p) { return self.posPoint(seat, move.token, p); }));
    var per = this.speed > 1.2 ? 92 : 66;

    var anim = {
      kind: 'hop',
      seat: seat,
      token: move.token,
      pts: pts,
      t0: performance.now(),
      dur: Math.max(120, per * (pts.length - 1)),
      i: 0
    };

    this.view.anims.push(anim);
    var delay = anim.dur + 90;

    this.after(delay, function () {
      if (self.destroyed || self.st.phase === 'over') {
        if (!events.win) return;
      }
      var wait = 0;

      Audio2.play('landing');
      Audio2.haptic('landing');

      if (events.captures.length) {
        var at = self.arrivalPt || pts[pts.length - 1];
        events.captures.forEach(function (cap) {
          self.view.particles.push({
            kind: 'burst',
            x: at.x,
            y: at.y,
            t0: performance.now(),
            dur: 520,
            color: self.st.seats[cap.seat].color
          });
        });
        Audio2.play('capture');
        Audio2.haptic('capture');
        self.emit('toast', {
          text: self.st.seats[seat].name + ' captured ' + self.st.seats[events.captures[0].seat].name,
          kind: 'capture'
        });
        wait = 340;
      }

      if (events.home) {
        var ctr = Board.homeSlots(self.m, self.st.seats[seat].color)[0];
        self.view.particles.push({
          kind: 'ripple',
          x: ctr.x,
          y: ctr.y,
          r0: self.m.cell * 0.5,
          t0: performance.now(),
          dur: 600
        });
        Audio2.play('home');
        Audio2.haptic('home');
        wait = Math.max(wait, 300);
      }

      self.after(wait, function () {
        if (events.win) {
          self.finishWin();
          return;
        }
        var extra = (self.st.lastRoll === 6) || events.captures.length > 0 || events.home;
        self.emit('dice', { state: 'idle' });
        self.endTurnFlow(extra);
      });
    });
  };

  Match.prototype.finishWin = function () {
    var self = this;
    Audio2.play('win');
    Audio2.haptic('win');
    this.after(650, function () { self.finish(); });
  };

  Match.prototype.homeOrder = function (seat, token) {
    var order = 0;
    for (var t = 0; t < token; t++) {
      if (this.st.tokens[seat][t] === E.HOME) order++;
    }
    return order;
  };

  Match.prototype.posPoint = function (seat, token, pos) {
    var color = this.st.seats[seat].color;
    var ho = pos === E.HOME ? this.homeOrder(seat, token) : null;
    var p = Board.pointForPos(this.m, color, pos, token, ho);
    return { x: p.x, y: p.y + this.m.cell * 0.16 };
  };

  Match.prototype.tokenPoint = function (seat, token, posOverride) {
    var pos = posOverride != null ? posOverride : this.st.tokens[seat][token];
    return this.posPoint(seat, token, pos);
  };

  /* 60 FPS Render Loop */
  Match.prototype.loop = function (ts) {
    if (!this.running || this.destroyed) return;
    this.raf = requestAnimationFrame(this._loopBound);
    var now = typeof ts === 'number' ? ts : performance.now();
    if (!this.m) {
      this.resize();
      if (!this.m) return;
    }

    var st = this.st;
    var deciding = st.phase !== 'over' && st.phase !== 'anim' &&
                   st.seats[st.turn].kind === 'human' && this.isLocalSeat(st.turn);
    var needsWork = this.view.anims.length > 0 || this.view.particles.length > 0 ||
                    (this.view.halos.length > 0 && st.phase === 'move') ||
                    (deciding && !this.reducedMotion);

    if (!needsWork && this._idleFrame) return;
    this._idleFrame = !needsWork;

    var ctx = this.ctx;
    var S = this.cssS;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    if (this.staticCv) ctx.drawImage(this.staticCv, 0, 0, S, S);

    var t = (needsWork ? now : 0) / 1000;

    if (deciding && st.phase !== 'anim') {
      Board.drawYardGlow(ctx, this.m, st.seats[st.turn].color, t);
    }

    if (st.phase === 'move' && this.view.halos.length) {
      var self2 = this;
      this.view.targets.forEach(function (mv) {
        var cr = E.posToCell(st.seats[st.turn].color, mv.to);
        if (cr) {
          Board.drawTarget(ctx, self2.m, cr, t);
        } else if (mv.to === E.HOME) {
          var ctr = Board.homeSlots(self2.m, st.seats[st.turn].color)[0];
          Board.drawRipple(ctx, ctr.x, ctr.y, self2.m.cell * 0.5, 0.5 + 0.4 * Math.sin(t * 5));
        }
      });
    }

    /* Token Stacking & Sorting */
    var drawList = this._drawList;
    drawList.length = 0;
    var groups = {};
    var seatIdx, tk;

    for (seatIdx = 0; seatIdx < st.seats.length; seatIdx++) {
      for (tk = 0; tk < 4; tk++) {
        if (this.animFor(seatIdx, tk)) continue;
        var pos = st.tokens[seatIdx][tk];
        var pt = this.posPoint(seatIdx, tk, pos);
        var key;
        if (pos === E.HOME) key = 'home' + seatIdx + ':' + tk;
        else if (pos === E.YARD) key = 'yard' + seatIdx + ':' + tk;
        else key = 'c:' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1);
        (groups[key] = groups[key] || []).push({ seat: seatIdx, token: tk, pt: pt, pos: pos });
      }
    }

    var cell = this.m.cell;
    var match = this;
    Object.keys(groups).forEach(function (k) {
      var g = groups[k];
      var n = g.length;
      var sameSeat = g.every(function (e) { return e.seat === g[0].seat; });
      g.forEach(function (e, i) {
        var off = { x: 0, y: 0 }, scale = 1;
        if (n === 2) {
          off = { x: (i === 0 ? -0.14 : 0.14) * cell, y: -0.05 * cell };
          scale = 0.95;
        } else if (n >= 3) {
          var r = Math.floor(i / 2), c = i % 2;
          off = { x: (c - 0.5) * 0.34 * cell, y: (r - (n > 3 ? 0.5 : 0)) * 0.28 * cell };
          scale = n >= 4 ? 0.78 : 0.85;
        }
        var isHome = e.pos === E.HOME;
        if (isHome) scale *= 0.52;
        drawList.push({
          x: e.pt.x + off.x,
          y: e.pt.y + off.y,
          seat: e.seat,
          token: e.token,
          scale: scale,
          halo: match.view.halos.indexOf(e.token) >= 0 && e.seat === st.turn && st.phase === 'move'
        });
        if (sameSeat && n >= 2 && i === 0) {
          drawList.push({ badge: true, x: e.pt.x + cell * 0.36, y: e.pt.y - cell * 0.58, n: n });
        }
      });
    });

    drawList.filter(function (d) { return !d.badge; }).sort(function (a, b) { return a.y - b.y; }).forEach(function (d) {
      var colorIdx = st.seats[d.seat].color;
      var lift = 0;
      if (d.halo) lift = 0.08 + 0.10 * Math.sin(t * 6 + d.token * 1.3);
      if (d.halo) Board.drawHalo(ctx, d.x, d.y, cell * 0.42, t, colorIdx);
      Board.drawToken(ctx, d.x, d.y, cell * 0.42, colorIdx, match.tokenShape(), { scale: d.scale, lift: lift });
    });

    drawList.filter(function (d) { return d.badge; }).forEach(function (d) {
      Board.drawCountBadge(ctx, d.x, d.y, d.n, cell);
    });

    /* Active Hopping Movers with Squash & Stretch */
    var self = this;
    this.view.anims = this.view.anims.filter(function (a) {
      var u = (now - a.t0) / a.dur;
      if (u >= 1) return false;
      var seg = (a.pts.length - 1) * Math.min(1, Math.max(0, u));
      var i = Math.min(a.pts.length - 2, Math.floor(seg));
      var f = seg - i;
      var p0 = a.pts[i], p1 = a.pts[i + 1];
      var hop = Math.sin(Math.PI * f);
      var x = p0.x + (p1.x - p0.x) * f;
      var y = p0.y + (p1.y - p0.y) * f - (self.reducedMotion ? 0 : hop * cell * 0.52);
      var colorIdx = st.seats[a.seat].color;

      // Squash and stretch at landing
      var squashX = 1.0, squashY = 1.0;
      if (hop < 0.15 && !self.reducedMotion) {
        var sq = (0.15 - hop) / 0.15;
        squashX = 1.0 + sq * 0.12;
        squashY = 1.0 - sq * 0.10;
      }

      if (a.i !== i) {
        a.i = i;
        Audio2.play('step', i);
      }

      Board.drawToken(ctx, x, y, cell * 0.46, colorIdx, self.tokenShape(), {
        lift: self.reducedMotion ? 0 : (0.22 + hop * 0.55),
        scale: 1.02,
        squashX: squashX,
        squashY: squashY
      });
      self.arrivalPt = { x: a.pts[a.pts.length - 1].x, y: a.pts[a.pts.length - 1].y };
      return true;
    });

    /* Particle Explosions & Shockwaves */
    this.view.particles = this.view.particles.filter(function (p) {
      var u = (now - p.t0) / p.dur;
      if (u >= 1) return false;
      if (p.kind === 'burst') Board.drawBurst(ctx, p.x, p.y, cell, p.color, u);
      if (p.kind === 'ripple') Board.drawRipple(ctx, p.x, p.y, p.r0, u);
      return true;
    });
  };

  Match.prototype.wake = function () { this._idleFrame = false; };
  Match.prototype.animFor = function (seat, token) {
    for (var i = 0; i < this.view.anims.length; i++) {
      var a = this.view.anims[i];
      if (a.seat === seat && a.token === token) return a;
    }
    return null;
  };
  Match.prototype.tokenShape = function () { return this.cfg.tokenShape || 'classic'; };

  /* Network Synchronization Helpers */
  Match.prototype.isLocalSeat = function (seatIdx) {
    if (seatIdx == null || !this.st) return false;
    if (this.cfg.mode === 'online') {
      return this.netGuest ? seatIdx === this.cfg.netSeat : seatIdx === 0;
    }
    return true;
  };

  Match.prototype.seatIsRemote = function (seatIdx) {
    if (this.cfg.mode !== 'online' || !this.st) return false;
    var color = this.st.seats[seatIdx].color;

    return !!(meta && meta.remote);
  };

  Match.prototype.announce = function (text) {
    this.emit('announce', { text: text });
  };

  Match.prototype.netGuestRoll = function (seatIdx) {
    if (this.destroyed || !this.netHost) return;
    if (this.st.phase !== 'roll' || this.diceBusy) return;
    this.doRoll();
  };

  Match.prototype.netGuestMove = function (seatIdx, move) {
    if (this.destroyed || !this.netHost) return;
    if (this.st.phase !== 'move') return;
    this.executeMove(move);
  };

  Match.prototype.netSyncHost = function (tag, fx) {
    if (this.netHost) this.netHost.sync(tag, fx);
  };

  Match.prototype.netAdvanceDisconnected = function (seatIdx) {
    if (this.destroyed || !this.netHost || this.st.phase === 'over') return;
    if (this.st.turn !== seatIdx || !this.seatIsRemote(seatIdx)) return;
    if (this.netHost.isSeatLive(seatIdx)) return;
    if (this.st.phase !== 'roll' && this.st.phase !== 'move') return;
    this.announce(this.st.seats[seatIdx].name + ' skipped — disconnected');
    this.endTurnFlow(false);
  };

  Match.prototype.netApply = function (snap) {
    if (this.destroyed || !snap || !this.netGuest) return;
    this.wake();
    if (snap.seq <= this.netSeq) return;
    this.netSeq = snap.seq;
    var fx = snap.fx || {}, st = snap.st;
    var self = this;

    if (snap.tag === 'rolled') {
      this.st = st;
      this.legal = st.phase === 'move' ? E.legalMoves(st, st.lastRoll) : [];
      this.emit('dice', { state: 'rolling', value: fx.value });
      Audio2.play('roll');
      Audio2.haptic('roll');
      this.after(400, function () {
        Audio2.play('land', fx.value);
        Audio2.haptic('land');
        self.announce(st.seats[st.turn].name + ' rolled ' + fx.value);
        if (fx.value === 6) { Audio2.play('six'); Audio2.haptic('six'); }
        if (fx.outcome === 'forfeit') {
          self.emit('toast', { text: 'Three sixes — turn passes', kind: 'info' });
          Audio2.play('noMove');
          Audio2.haptic('noMove');
          return;
        }
        if (fx.outcome === 'nomoves') {
          self.emit('toast', { text: 'No moves for ' + st.seats[st.turn].name, kind: 'info' });
          Audio2.play('noMove');
          Audio2.haptic('noMove');
          return;
        }
        if (fx.outcome === 'choose' && self.isLocalSeat(st.turn)) {
          self.view.halos = self.legal.map(function (mv) { return mv.token; });
          self.view.targets = self.legal;
          self.emit('dice', { state: 'done', value: fx.value });
          self.emit('hud');
          self.announce('Your move — pick a token');
        }
      });
      this.emit('hud');
      return;
    }

    if (snap.tag === 'moved') {
      this.st = st;
      var move = fx.move || { token: 0, from: 0, to: 0 };
      var events = {
        seat: fx.seat,
        move: move,
        path: E.pathPositions(move.from, move.to),
        captures: fx.captures || [],
        home: !!fx.home,
        win: !!fx.win
      };
      this.st.phase = 'anim';
      this.animateMoveVisual(fx.seat, move, events);
      return;
    }

    if (snap.tag === 'turn') {
      this.st = st;
      this.legal = [];
      this.view.halos = [];
      this.view.targets = [];
      this.emit('hud');
      this.emit('turn', { seat: st.turn, seatInfo: st.seats[st.turn] });
      this.armRoll();
      return;
    }

    if (snap.tag === 'end') {
      this.st = st;
      this.finish();
      return;
    }
  };

  Match.prototype.animateMoveVisual = function (seat, move, events) {
    var self = this;
    var fromPt = this.tokenPoint(seat, move.token, move.from);
    var pts = [fromPt].concat(events.path.map(function (p) { return self.posPoint(seat, move.token, p); }));
    var per = this.speed > 1.2 ? 92 : 66;
    var anim = {
      kind: 'hop',
      seat: seat,
      token: move.token,
      pts: pts,
      t0: performance.now(),
      dur: Math.max(120, per * (pts.length - 1)),
      i: 0
    };
    this.view.anims.push(anim);
    this.arrivalPt = null;

    this.after(anim.dur + 90, function () {
      var wait = 0;
      Audio2.play('landing');
      Audio2.haptic('landing');

      if (events.captures.length) {
        var at = self.arrivalPt || pts[pts.length - 1];
        events.captures.forEach(function (cap) {
          self.view.particles.push({
            kind: 'burst',
            x: at.x,
            y: at.y,
            t0: performance.now(),
            dur: 520,
            color: self.st.seats[cap.seat].color
          });
        });
        Audio2.play('capture');
        Audio2.haptic('capture');
        self.emit('toast', { text: self.st.seats[seat].name + ' captured ' + self.st.seats[events.captures[0].seat].name, kind: 'capture' });
        self.announce(self.st.seats[seat].name + ' captured ' + self.st.seats[events.captures[0].seat].name);
        wait = 340;
      }

      if (events.home) {
        var ctr = Board.homeSlots(self.m, self.st.seats[seat].color)[0];
        self.view.particles.push({ kind: 'ripple', x: ctr.x, y: ctr.y, r0: self.m.cell * 0.5, t0: performance.now(), dur: 600 });
        Audio2.play('home');
        Audio2.haptic('home');
        self.announce(self.st.seats[seat].name + ' brought a token home');
        wait = Math.max(wait, 300);
      }
      self.emit('hud');
    });
  };

  /* Input Handling */
  Match.prototype.hitTest = function (px, py) {
    if (this.st.phase !== 'move' || this.st.seats[this.st.turn].kind !== 'human' || !this.legal.length) return null;
    var cell = this.m.cell, best = null, bestD = cell * 0.78;
    var self = this;
    var cand = {};
    this.legal.forEach(function (mv) { cand[mv.token] = mv; });
    Object.keys(cand).forEach(function (tk) {
      var mv = cand[tk];
      var pt = self.posPoint(self.st.turn, +tk, self.st.tokens[self.st.turn][+tk]);
      var d = Math.hypot(px - pt.x, py - (pt.y - cell * 0.35));
      if (d < bestD) { bestD = d; best = mv; }
    });
    return best;
  };

  Match.prototype.pointerDown = function (ev) {
    if (this.destroyed) return;
    var rect = this.canvas.getBoundingClientRect();
    var x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    var mv = this.hitTest(x, y);
    if (mv) {
      Audio2.play('tap');
      this.executeMove(mv);
    }
  };

  Match.prototype.rollRequest = function () {
    if (this.destroyed || this.st.phase !== 'roll') return;
    var s = this.st.seats[this.st.turn];
    if (s.kind !== 'human' || this.diceBusy || this.awaitingHandoff) return;
    if (this.netGuest) {
      if (this.isLocalSeat(this.st.turn)) this.netGuest.requestRoll();
      return;
    }
    this.doRoll();
  };

  Match.prototype.diceForSelection = function (n) {
    if (this.st.phase !== 'move' || this.st.seats[this.st.turn].kind !== 'human') return;
    var mv = this.legal.filter(function (m) { return m.token === n - 1; })[0];
    if (mv) this.executeMove(mv);
  };

  /* Lifecycle & State Preservation */
  Match.prototype.pause = function () {
    if (this.destroyed || this.paused) return;
    var st = this.st;
    var waitingDice = st.phase === 'roll' && st.seats[st.turn].kind === 'human';
    var choosing = st.phase === 'move' && st.seats[st.turn].kind === 'human';
    if (waitingDice || choosing || this.awaitingHandoff) {
      this.clearTimers();
      this.view.anims = [];
      this.freezeNow();
    } else {
      this.pauseRequested = true;
    }
  };

  Match.prototype.resumePaused = function () {
    if (this.destroyed || !this.paused) {
      this.pauseRequested = false;
      return;
    }
    this.paused = false;
    this.pauseRequested = false;
    this.running = true;
    this.diceBusy = false;
    this.loop(performance.now());
    var st = this.st;
    if (this.awaitingHandoff) return;
    if (st.phase === 'move' && st.seats[st.turn].kind === 'human') {
      this.representMovePhase();
      this.emit('dice', { state: 'done', value: st.lastRoll });
    } else if (st.phase === 'roll' && this.needsHandoff(st.turn)) {
      this.awaitingHandoff = true;
      this.emit('handoff', { seat: st.turn, seatInfo: st.seats[st.turn] });
    } else {
      this.armRoll();
    }
  };

  Match.prototype.representMovePhase = function () {
    var self = this;
    this.legal = E.legalMoves(this.st, this.st.lastRoll);
    if (!this.legal.length) {
      this.st.phase = 'roll';
      this.st.lastRoll = null;
      this.armRoll();
      return;
    }
    if (this.legal.length === 1) {
      var singleMove = this.legal[0];
      this.after(220, function () {
        if (self.st && self.st.phase === 'move') self.executeMove(singleMove);
      });
    } else if (this.st.seats[this.st.turn].kind === 'ai') {
      this.after(AI.thinkDelay(this.st.seats[this.st.turn].ai), function () {
        if (self.st && self.st.phase === 'move') {
          self.executeMove(AI.chooseMove(self.st, self.st.turn, self.st.lastRoll, self.st.seats[self.st.turn].ai));
        }
      });
    } else {
      this.view.halos = this.legal.map(function (mv) { return mv.token; });
      this.view.targets = this.legal;
      this.emit('hud');
      if (this.st.seats[this.st.turn].kind === 'human') {
        this.emit('dice', { state: 'done', value: this.st.lastRoll });
      }
    }
  };

  Match.prototype.emit = function (name, data) {
    var cb = this['on' + name.charAt(0).toUpperCase() + name.slice(1)];
    if (typeof cb === 'function') cb(data);
  };

  Match.prototype.destroy = function () {
    this.destroyed = true;
    this.running = false;
    this.clearTimers();
    cancelAnimationFrame(this.raf);
    if (this.ro) {
      try { this.ro.disconnect(); } catch (e) {}
      this.ro = null;
    }
  };

  /* Module API */
  var Game = {
    active: function () { return G; },
    _Match: Match,
    start: function (canvas, cfg, savedState) {
      if (G) G.destroy();
      G = new Match();
      G.start(canvas, cfg, savedState);
      return G;
    },
    destroy: function () {
      if (G) {
        G.destroy();
        G = null;
      }
    },
    saved: function () {
      var pkt = Store.load(Store.keys.match, function (o) {
        if (!o || o.v !== 1 || !o.cfg || !o.st) return false;
        return !!E.validateState(o.st);
      });
      return pkt;
    }
  };

  global.LudoraGame = Game;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    if (curId === target) return;
    teardownScreen(curId);

      show(id, dir || 'push');
      return true;
    },
    replace: function (id, dir) {
      navStack = id === 'scr-home' ? ['scr-home'] : ['scr-home', id];
      try { history.replaceState({ s: id }, ''); } catch (e) {}
      show(id, dir || 'fade');
      return true;
    },
    back: function () {
      if (navStack.length <= 1) return;
      var target = navStack[navStack.length - 2];
      navStack.pop();

    var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

    [1, 2, 3, 4, 5, 6].forEach(function (v) {
      html += '<div class="face f' + v + '">';
      for (var i = 0; i < 9; i++) {
        html += PIPS[v].indexOf(i) >= 0 ? '<span class="pip"></span>' : '<span></span>';
      }
      html += '</div>';
    });
    cube.innerHTML = html;
    setCube(1, true);
  }

  function setCube(v, instant) {
    cubeVal = v;
    var cube = $('cube');
    var orient = { 1: [0, 0], 2: [-90, 0], 3: [0, -90], 4: [0, 90], 5: [90, 0], 6: [0, 180] }[v] || [0, 0];
    spinN += 1;
    var sx = 360 * (1 + (spinN % 2)), sy = 360 * (1 + ((spinN + 1) % 2));
    if (instant) {
      cube.style.transition = 'none';
      cube.style.transform = 'rotateX(' + orient[0] + 'deg) rotateY(' + orient[1] + 'deg)';
      void cube.offsetWidth;
      cube.style.transition = '';
    } else {
      cube.style.transform = 'rotateX(' + (orient[0] + sx) + 'deg) rotateY(' + (orient[1] + sy) + 'deg)';
    }
  }

  function wireGame(g, cfg) {
    var engineSeats = g.st.seats;
    var hud = $('hud');

    function renderHUD(opts) {
      opts = opts || {};
      var st = g.st;
      hud.innerHTML = engineSeats.map(function (s, i) {
        var meta = seatMeta(cfg, s);
        var homes = st.tokens[i].filter(function (p) { return p === E.HOME; }).length;
        var active = i === st.turn && st.phase !== 'over';
        var think = opts.thinking && active;
        var glass = GLASS[s.color] || GLASS[0];
        return '<div class="pill' + (active ? ' active' : '') + '" style="color:' + COLOR_VARS[s.color] + ';' +
          (active ? 'background:' + glass.bg + ';box-shadow:inset 0 0 0 1.5px ' + glass.bd : '') + '">' +
          avatarHTML(s.name, meta.avatar) +
          '<div class="meta"><div class="name">' + esc(s.name) + '</div>' +
          '<div class="sub"><span class="homes">' + [0, 1, 2, 3].map(function (t) { return '<i class="' + (t < homes ? 'on' : '') + '"></i>'; }).join('') + '</span>' +
          '<span class="caps">' + icon('swords') + st.stats[i].captures + '</span>' +
          (think ? '<span class="thinking"></span>' : '') +
          '</div></div>' +
          '<span class="bar" style="background:' + COLOR_VARS[s.color] + '"></span></div>';
      }).join('');
    }

    function seatMeta(cfg, engineSeat) {
      var m = cfg.seats.filter(function (x) { return x.color === engineSeat.color; })[0];
      return m || { avatar: engineSeat.color % 8 };
    }

    function turnChip(mode, sub, seatIdx, dim) {
      var st = g.st;
      var s = engineSeats[seatIdx != null ? seatIdx : st.turn];
      var meta = seatMeta(cfg, s);
      $('turnChip').className = dim ? 'think' : '';
      $('turnChip').innerHTML = avatarHTML(s.name, meta.avatar) +
        '<div class="grow"><div class="t" style="color:' + (dim ? '' : COLOR_VARS[s.color]) + '">' + esc(mode) + '</div>' +
        (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
    }

    g.onHud = function (opts) {
      renderHUD(opts || {});
      if (cfg.mode === 'online' && mp.room) updateNetChipHost();
    };

    g.onTurn = function (ev) {
      renderHUD();
      var s = ev.seatInfo;
      turnChip(s.name, s.kind === 'ai' ? AI.levels[s.ai].name + ' AI' : 'Your move', ev.seat, s.kind === 'ai');
    };

    g.onDice = function (ev) {
      var btn = $('diceBtn'), hint = $('rollHint'), glow = $('diceGlow');
      btn.className = '';
      hint.className = '';
      glow.className = '';

      if (ev.state === 'ready') {
        btn.classList.add('ready');
        hint.classList.add('show');
        glow.classList.add('show');
        glow.style.background = 'radial-gradient(circle at 50% 44%, ' + glowColor(engineSeats[g.st.turn].color) + ' 0%, transparent 64%)';
        turnChip('Your turn', 'Tap the dice to roll', null, false);
      } else if (ev.state === 'ai-wait') {
        btn.classList.add('dim');
        turnChip(engineSeats[g.st.turn].name, 'Thinking...', null, true);
      } else if (ev.state === 'remote-wait') {
        btn.classList.add('dim');
        var rs = engineSeats[g.st.turn];
        turnChip(rs.name, rs.kind === 'ai' ? 'Thinking...' : 'Playing on remote device', null, true);
      } else if (ev.state === 'rolling') {
        btn.classList.add('busy');
        setCube(ev.value, false);
      } else if (ev.state === 'done') {
        setCube(ev.value, true);
      } else {

    g.onToast = function (ev) {
      toast(ev.text, ev.kind, ev.kind === 'capture' ? 'swords' : 'info');

    g.onAnnounce = function (ev) {

          '<span class="sub" style="margin-left:6px">tap when ready</span>';

      menu.classList.add('hidden');

  function seatMeta2(cfg, engineSeat) {
    var m = cfg.seats.filter(function (x) { return x.color === engineSeat.color; })[0];
    return m || { avatar: engineSeat.color % 8 };

  function confetti(winnerColor) {
    var cv = $('confetti');
    var scr = $('scr-end');
    if (!cv || !scr) return;
    cv.width = scr.clientWidth * (devicePixelRatio > 1 ? 1.5 : 1);
    cv.height = scr.clientHeight * (devicePixelRatio > 1 ? 1.5 : 1);
    var ctx = cv.getContext('2d');
    var colors = [Board.PLAYERS[0].base, Board.PLAYERS[1].base, Board.PLAYERS[2].base, Board.PLAYERS[3].base, '#F3F4F6', '#E9BE55'];
    var parts = [];

    for (var i = 0; i < 120; i++) {
      parts.push({
        x: Math.random() * cv.width,
        y: -30 - Math.random() * cv.height * 0.5,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        c: colors[i % colors.length],
        vy: 2.2 + Math.random() * 3.4,
        vx: -1.4 + Math.random() * 2.8,
        rot: Math.random() * Math.PI,
        vr: -0.12 + Math.random() * 0.24
      });
    }

    var t0 = performance.now();
    (function tick(now) {
      var el2 = (now - t0) / 1000;
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (el2 > 3.4) return;
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - el2 / 3.2);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      requestAnimationFrame(tick);
    })(t0);
  }

  /* ---------- MULTIPLAYER P2P ---------- */
  var mp = { room: null, guest: null, role: null, view: null, invite: {} };

  function mpReset() {
    mp.room = null;
    mp.guest = null;
    mp.role = null;
    mp.view = null;
    mp.invite = {};
  }

  function mpTearDownIfAbandoned() {
    var inGame = $('scr-game').classList.contains('active') || $('scr-end').classList.contains('active');
    if (inGame) return;
    if (mp.room) { mp.room.close('host-left'); mpReset(); }
    else if (mp.guest) { try { mp.guest.leave(); } catch (e) {} mpReset(); }
  }

  function mpCopy(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          toast('Copied to clipboard', 'good', 'check');
        }, function () {
          toast('Select and copy manually', 'info', 'info');
        });
        return;
      }
    } catch (e) {}
    toast('Select and copy manually', 'info', 'info');
  }

  function mpShare(text) {
    try {
      if (navigator.share) {
        navigator.share({ title: 'Ludora room invite', text: text }).catch(function () {});
        return;
      }
    } catch (e) {}
    mpCopy(text);
  }

  function mpQR(host, code) {
    var box = $(host);
    if (!box) return;
    var url = location.origin + location.pathname + '#j=' + code;
    var qr = url.length <= 850 ? QR.encodeText(url) : null;
    if (!qr) {
      box.innerHTML = '<div class="mp-note" style="text-align:center;padding-top:84px">Invite too long for QR — use Copy or Share.</div>';
      return;
    }
    box.innerHTML = '<canvas width="424" height="424" aria-label="Invite QR code"></canvas>';
    var cv = box.querySelector('canvas');
    var ctx = cv.getContext('2d');
    QR.drawCanvas(qr, ctx, 424, '#0B0C10', '#FFFFFF');
  }

  function updateNetChip(state, rtt) {
    var chip = $('netChip');
    if (!chip || chip.classList.contains('hidden')) return;
    var cls = 'dot on', label = '';
    if (state === 'lost') { cls = 'dot off'; label = 'offline'; }
    else if (state === 'warn') { cls = 'dot warn'; label = 'weak'; }
    if (rtt != null && state !== 'lost') label = rtt + ' ms';
    chip.innerHTML = '<span class="' + cls + '"></span>' + (label ? '<span>' + label + '</span>' : '');
  }

  function netChipFromRtt(rtt) {
    updateNetChip(rtt == null ? 'ok' : (rtt > 400 ? 'warn' : 'ok'), rtt);
  }

  function updateNetChipHost() {
    var room = mp.room;
    if (!room) return;
    var worst = -1, anyDown = false, peers = 0;
    room.seats.forEach(function (s) {
      if (s.kind !== 'remote') return;
      peers++;
      if (!s.connected) anyDown = true;
      else if (typeof s.rtt === 'number' && s.rtt > worst) worst = s.rtt;
    });
    if (anyDown) updateNetChip(peers > 1 ? 'warn' : 'lost', worst >= 0 ? worst + ' ms' : null);
    else updateNetChip(worst > 400 ? 'warn' : 'ok', worst >= 0 ? worst : null);
  }

        '<div class="seg" id="mpSize"' + segAttrs(3, mpSize - 2) + '>' +
          '<button data-n="2"' + (mpSize === 2 ? ' class="on"' : '') + '>2 players</button>' +
          '<button data-n="3"' + (mpSize === 3 ? ' class="on"' : '') + '>3</button>' +
          '<button data-n="4"' + (mpSize === 4 ? ' class="on"' : '') + '>4</button>' +
        '</div>' +
        '<button class="btn btn-primary" id="mpCreate" style="margin-top:14px;width:100%">' + icon('play') + 'Create Room</button>' +
      '</div>' +

      '<div class="label">Join a room</div>' +
      '<div class="card">' +
        '<textarea class="mp-input" id="mpJoinCode" placeholder="Paste the invite code you received" aria-label="Invite code"></textarea>' +
        '<input class="mp-text" id="mpJoinName" maxlength="16" placeholder="Your name" aria-label="Your name" style="margin-top:10px" value="' + esc(profile.name) + '"></input>' +
        '<button class="btn btn-primary" id="mpConnect" style="margin-top:12px;width:100%">' + icon('download') + 'Connect</button>' +
        '<div class="mp-note" id="mpJoinNote">You will get a short reply code to send back to the host to establish the connection.</div>' +
      '</div>';

    $('mpBack').addEventListener('click', function () { Audio2.play('tap'); Nav.back(); });

    $('mpSize').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      mpSize = +b.dataset.n;
      Audio2.play('tap');
      var idx = Array.prototype.indexOf.call($('mpSize').querySelectorAll('button'), b);
      $('mpSize').style.setProperty('--i', idx);
      $('mpSize').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    });

    $('mpCreate').addEventListener('click', function () {
      Audio2.play('tap');
      hostCreateRoom();
    });

    if (prefilled) {
      var inp = $('mpJoinCode');
      inp.value = prefilled;
      toast('Invite loaded — press Connect', 'good', 'people');
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    }

    $('mpConnect').addEventListener('click', function () {
      Audio2.play('tap');
      guestConnect($('mpJoinCode').value, $('mpJoinName').value);
    });
  }

  function hostCreateRoom() {
    mpReset();
    mp.role = 'host';
    mp.room = new Mp.Room({
      size: mpSize,
      hostName: profile.name,
      hostAvatar: profile.avatar,
      onEvent: hostRoomEvent
    });
    renderRoomHost();
    show('scr-room', 'push');
    try { history.pushState({ s: 'scr-room' }, ''); } catch (e) {}
  }

  function hostRoomEvent(name, data) {
    if (name === 'seats') {
      if (mp.view === 'room') renderRoomHost();
      updateNetChipHost();
    } else if (name === 'disconnect') {
      hostDisconnectSheet(data);
    } else if (name === 'reconnect') {
      toast(data.name ? data.name + ' reconnected' : 'Player reconnected', 'good', 'people');
    }
  }

  function seatCardHtml(s, isHostUi) {
    var stateHtml;
    if (s.kind === 'host') stateHtml = '<span class="state"><span class="dot on"></span>Host</span>';
    else if (s.kind === 'ai') stateHtml = '<span class="state">' + AI.levels[s.ai].name + ' AI</span>';
    else if (s.kind === 'remote' && s.connected) stateHtml = '<span class="state"><span class="dot on"></span>' + (s.ready ? 'Ready' : 'Not ready') + '</span>';
    else if (s.kind === 'remote' && !s.connected && s.name) stateHtml = '<span class="state"><span class="dot off"></span>Disconnected</span>';
    else stateHtml = '<span class="state"><span class="dot"></span>Empty</span>';

    var av = s.kind === 'remote' || s.kind === 'host'
      ? avatarHTML(s.name || '?', s.avatar || 0)
      : '<span class="avatar" style="background:linear-gradient(145deg,#7d828f,#4c505b)">' + icon('pawn') + '</span>';

    return '<div class="seat-card">' + av +
      '<div class="grow"><div class="role">' + COLOR_NAMES[s.color] + ' · Seat ' + (s.seat + 1) + '</div>' +
      '<div class="t">' + (s.name ? esc(s.name) : (s.kind === 'ai' ? 'Computer' : 'Waiting for player')) + '</div></div>' +
      stateHtml + '</div>';
  }

  function renderRoomHost() {
    if (mp.role !== 'host' || !mp.room) return;
    mp.view = 'room';
    var room = mp.room;
    var scr = $('scr-room');

    scr.innerHTML =
      '<div class="nav"><button class="navbtn" id="rBack" aria-label="Leave room">' + icon('back') + '</button><span class="title">Room Lobby</span></div>' +
      '<div style="text-align:center;animation:fadeUp .5s var(--ease) both">' +
        '<span class="room-id-chip">' + esc(room.id) + '</span>' +
        '<div class="code-actions" style="max-width:300px;margin:10px auto 0">' +
          '<button class="btn btn-tint" id="rCopyId">' + icon('edit') + 'Copy ID</button>' +
          '<button class="btn btn-tint" id="rShareId">' + icon('share') + 'Share</button>' +
        '</div>' +
        '<div class="mp-note" style="margin-top:8px">Share the Room ID or generate seat invites below.</div>' +
      '</div>' +
      '<div class="label">Seats</div>' +
      '<div id="rSeats">' + room.seats.map(function (s) { return seatCardHtml(s, true); }).join('') + '</div>' +
      '<div id="rSeatActions" style="display:flex;flex-direction:column;gap:8px;margin-top:12px"></div>' +
      '<div style="flex:1"></div>' +
      '<button class="btn btn-primary" id="rStart"' + (room.allReady() ? '' : ' disabled') + '>' + icon('play') + 'Start Match</button>' +
      '<div class="mp-note" style="text-align:center;margin-top:8px">All connected players must be ready. Empty seats can be filled by AI.</div>';

    var rBack = $('rBack');
    if (rBack) {
      rBack.addEventListener('click', function () {
        Audio2.play('tap');
        if (mp.room) {
          mp.room.close('host-left');
          mpReset();
        }
        renderHome();
        Nav.replace('scr-home', 'fade');
      });
    }

    $('rCopyId').addEventListener('click', function () { Audio2.play('tap'); mpCopy(room.id); });
    $('rShareId').addEventListener('click', function () { Audio2.play('tap'); mpShare('Join my Ludora room ' + room.id); });

    $('rStart').addEventListener('click', function () {
      if (!room.allReady()) return;
      Audio2.play('tap');
      hostStartMatch();
    });

    var actions = $('rSeatActions');
    room.seats.forEach(function (s) {
      if (s.seat === 0) return;
      var row = document.createElement('div');
      row.className = 'card';

      if (s.kind === 'remote' && s.connected) {
        row.innerHTML = '<div class="row">' + tile('t-green', 'people') +
          '<span class="grow t" style="font-size:14.5px;font-weight:650">' + esc(s.name || 'Player') + ' connected</span>' +
          (room.state === 'lobby' ? '<button class="kind-btn" id="drop' + s.seat + '">Remove</button>' : '') + '</div>';
      } else if (s.kind === 'remote' && !s.connected && s.name) {
        row.innerHTML = '<div class="row">' + tile('t-gold', 'refresh') +
          '<span class="grow"><span class="t" style="font-size:14.5px;font-weight:650">' + esc(s.name) + ' disconnected</span><br/><span class="s" style="font-size:12px;color:var(--text-3)">Re-invite to let them rejoin</span></span>' +
          (room.state === 'lobby' ? '<button class="kind-btn" id="drop' + s.seat + '">Clear</button>' : '') + '</div>' +
          '<button class="btn btn-tint" id="again' + s.seat + '" style="width:100%;height:44px;font-size:14px;margin-top:10px">' + icon('refresh') + 'Re-invite</button>';
      } else if (s.kind === 'ai') {
        row.innerHTML = '<div class="row">' + tile('t-indigo', 'pawn') +
          '<span class="grow t" style="font-size:14.5px;font-weight:650">AI · ' + AI.levels[s.ai].name + '</span>' +
          '<button class="kind-btn" id="ai' + s.seat + '">Difficulty</button>' +
          '<button class="kind-btn" id="human' + s.seat + '">Open</button></div>';
      } else {
        row.innerHTML = '<div class="row">' + tile('t-blue', 'download') +
          '<span class="grow"><span class="t" style="font-size:14.5px;font-weight:650">Seat ' + (s.seat + 1) + ' — Invite</span></span>' +
          '<button class="kind-btn ai-on" id="ai' + s.seat + '">Add AI</button></div>' +
          '<button class="btn btn-tint" id="invite' + s.seat + '" style="width:100%;height:44px;font-size:14px;margin-top:10px">' + icon('people') + 'Generate Invite</button>' +
          '<div id="inviteBox' + s.seat + '"></div>';
      }
      actions.appendChild(row);
    });

    room.seats.forEach(function (s) {
      var seat = s.seat;
      var invBtn = $('invite' + seat);
      if (invBtn) invBtn.addEventListener('click', function () { Audio2.play('tap'); hostInvite(seat); });
      var againBtn = $('again' + seat);
      if (againBtn) againBtn.addEventListener('click', function () { Audio2.play('tap'); hostInvite(seat, true); });
      var aiBtn = $('ai' + seat);
      if (aiBtn) aiBtn.addEventListener('click', function () {
        Audio2.play('tap');
        if (s.kind === 'ai') room.setAiSeat(seat, (s.ai + 1) % 3);
        else room.setAiSeat(seat, 1);
        renderRoomHost();
      });
      var humanBtn = $('human' + seat);
      if (humanBtn) humanBtn.addEventListener('click', function () {
        Audio2.play('tap');
        room.setAiSeat(seat, null);
        renderRoomHost();
      });
      var dropBtn = $('drop' + seat);
      if (dropBtn) dropBtn.addEventListener('click', function () {
        Audio2.play('tap');
        room.kick(seat, 'bye');
        renderRoomHost();
      });
    });
  }

  function hostInvite(seat, isReinvite) {
    var box = $('inviteBox' + seat) || (function () {
      var b = document.createElement('div');
      b.id = 'inviteBox' + seat;
      var row = $('again' + seat) && $('again' + seat).parentElement;
      (row || document.body).appendChild(b);
      return b;
    })();

    box.innerHTML = '<div class="mp-note" style="padding-top:10px">Gathering WebRTC connection info…</div>';
    var room = mp.room;

    room.inviteSeat(seat).then(function (res) {
      mp.invite[seat] = { code: res.code, token: res.token };
      box.innerHTML =
        '<div class="label" style="margin:12px 0 8px">1 · Send this invite code</div>' +
        '<div class="code-box" id="invCode' + seat + '">' + esc(res.code) + '</div>' +
        '<div class="code-actions">' +
          '<button class="btn btn-tint" id="invCopy' + seat + '">Copy</button>' +
          '<button class="btn btn-tint" id="invShare' + seat + '">Share</button>' +
        '</div>' +
        '<div class="qr-frame" id="invQr' + seat + '"></div>' +
        '<div class="label" style="margin:16px 0 8px">2 · Paste their reply code</div>' +
        '<textarea class="mp-input" id="invAns' + seat + '" style="min-height:64px" placeholder="Reply code starts with LUD" aria-label="Reply code"></textarea>' +
        '<button class="btn btn-primary" id="invLink' + seat + '" style="width:100%;height:46px;margin-top:10px">' + icon('check') + 'Link player</button>';

      $('invCopy' + seat).addEventListener('click', function () { Audio2.play('tap'); mpCopy(res.code); });
      $('invShare' + seat).addEventListener('click', function () { Audio2.play('tap'); mpShare(res.code); });

      $('invLink' + seat).addEventListener('click', function () {
        var ans = $('invAns' + seat).value.trim();
        if (!ans) return;
        var peer = room.seats[seat].peer;
        if (!peer) { toast('Invite expired — create a new one', 'info', 'info'); return; }
        peer.acceptAnswer(ans).then(function () {
          toast('Linking Seat ' + (seat + 1) + '…', 'good', 'people');
        }).catch(function (err) {
          toast(err.message || 'Could not link reply code', 'info', 'info');
        });
      });

      mpQR('invQr' + seat, res.code);
    }).catch(function (err) {
      box.innerHTML = '<div class="mp-note" style="padding-top:10px;color:var(--danger)">' + esc(err.message || 'WebRTC unavailable') + '</div>';
    });
  }

  function hostStartMatch() {
    var room = mp.room;
    var cfg = room.buildCfg({
      board: profile.cosmetics.board,
      dice: profile.cosmetics.dice,
      token: profile.cosmetics.token
    });
    cfg.seats[0].name = profile.name;
    cfg.seats[0].avatar = profile.avatar;
    mp.view = 'game';
    startMatch(cfg, null);
    var g = Game.active();
    g.netHost = room;
    room.match = g;
    room.started();
  }

  function hostDisconnectSheet(data) {
    var menu = $('pauseMenu');
    var room = mp.room;
    if (!room || !menu) return;
    menu.classList.remove('hidden');
    menu.innerHTML =
      '<div class="action-sheet">' +
        '<button class="btn btn-primary as-primary" id="dcWait">' + icon('pause') + 'Wait for reconnect</button>' +
        '<div class="as-caption">' + esc(data.name) + ' disconnected · turns skipped meanwhile</div>' +
        '<div class="as-group">' +
          '<button class="as-row" id="dcAi">' + tile('t-indigo', 'pawn') + '<span class="grow"><span class="t">Replace with AI</span><span class="s">Keeps match moving</span></span></button>' +
          '<button class="as-row danger center" id="dcEnd">End match by progress</button>' +
        '</div>' +
      '</div>';

    $('dcWait').addEventListener('click', function () { menu.classList.add('hidden'); });
    $('dcAi').addEventListener('click', function () {
      menu.classList.add('hidden');
      room.convertToAi(data.seat, 1);
      toast('Seat taken over by AI', 'good', 'pawn');
    });
    $('dcEnd').addEventListener('click', function () {
      menu.classList.add('hidden');
      room.endMatchByHost();
    });

  /* ---------- GUEST MULTIPLAYER ---------- */
  function guestConnect(codeText, name) {
    var note = $('mpJoinNote');
    if (!codeText || codeText.trim().length < 10) {
      toast('Paste the invite code first', 'info', 'info');
      return;
    }
    mpReset();
    mp.role = 'guest';
    name = Mp.sanitizeName(name || profile.name);
    var peer = new Net.Peer({ label: 'guest' });
    mp.guest = new Mp.Guest({ peer: peer, name: name, avatar: profile.avatar, onEvent: guestEvent });
    note.textContent = 'Building your reply code…';

    peer.acceptOffer(codeText.trim()).then(function (answerCode) {
      mp.view = 'answer';
      renderGuestAnswer(answerCode, name);
      show('scr-room', 'push');
      try { history.pushState({ s: 'scr-room' }, ''); } catch (e) {}
    }).catch(function (err) {
      note.textContent = '';
      toast(err.message || 'Invalid invite code', 'info', 'info');
      mpReset();
    });
  }

  function renderGuestAnswer(answerCode, name) {
    mp.view = 'answer';
    $('scr-room').innerHTML =
      '<div class="nav"><button class="navbtn" id="gBack" aria-label="Cancel">' + icon('back') + '</button><span class="title">Almost there</span></div>' +
      '<div class="card" style="animation:fadeUp .5s var(--ease) both">' +
        '<div class="row">' + tile('t-gold', 'edit') +
          '<div class="grow"><div class="t" style="font-size:16px;font-weight:700">Send this reply to the host</div>' +
          '<div class="s" style="font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.45">The host pastes it into their room. The link connects as soon as they link your seat.</div></div></div>' +
        '<div class="code-box" style="margin-top:12px">' + esc(answerCode) + '</div>' +
        '<div class="code-actions">' +
          '<button class="btn btn-tint" id="gCopy">Copy</button>' +
          '<button class="btn btn-tint" id="gShare">Share</button>' +
        '</div>' +
        '<div class="qr-frame" id="gQr"></div>' +
        '<div class="row" style="margin-top:14px;justify-content:center;gap:8px"><span class="thinking"></span><span class="s" style="font-size:13px;color:var(--text-2)">Waiting for host to link your seat…</span></div>' +
      '</div>';

    $('gBack').addEventListener('click', function () {
      Audio2.play('tap');
      if (mp.guest) mp.guest.leave();
      mpReset();
      Nav.back();
    });

    $('gCopy').addEventListener('click', function () { Audio2.play('tap'); mpCopy(answerCode); });
    $('gShare').addEventListener('click', function () { Audio2.play('tap'); mpShare(answerCode); });
    mpQR('gQr', answerCode);
  }

  function guestEvent(name, data) {
    switch (name) {
      case 'welcome':
        mp.view = 'guest-lobby';
        renderGuestLobby(data);
        netChipFromRtt(null);
        break;
      case 'seats':
        if (mp.view === 'guest-lobby') renderGuestLobby({ seats: data });
        break;
      case 'start':
        startGuestMatch(data);
        break;
      case 'sync':
        {
          var g = Game.active();
          if (g && g.netGuest) g.netApply(data);
        }
        break;
      case 'status':
        toast(data.text, 'info', 'people');
        break;
      case 'rtt':
        netChipFromRtt(data.rtt);
        break;
      case 'connection':
        if (data.up === false) guestLost(data.why);
        break;
      case 'closed':
        guestClosedByHost(data.reason);
        break;
    }
  }

  function renderGuestLobby(info) {
    mp.view = 'guest-lobby';
    var seats = info.seats || [];
    var me = mp.guest;
    var mySeat = seats.filter(function (s) { return s.seat === me.seat; })[0];
    var ready = mySeat ? !!mySeat.ready : false;

    $('scr-room').innerHTML =
      '<div class="nav"><button class="navbtn" id="glBack" aria-label="Leave room">' + icon('back') + '</button><span class="title">' + esc(mp.guest.room || 'Room') + '</span></div>' +
      '<div style="text-align:center;animation:fadeUp .5s var(--ease) both">' +
        '<span class="room-id-chip">' + esc(mp.guest.room || '· · ·') + '</span>' +
        '<div class="mp-note" style="margin-top:8px">Connected peer-to-peer. Waiting for host to start.</div>' +
      '</div>' +
      '<div class="label">Players</div>' +
      '<div>' + seats.map(function (s) { return seatCardHtml(s, false); }).join('') + '</div>' +
      '<div style="flex:1"></div>' +
      '<button class="btn ' + (ready ? 'btn-tint' : 'btn-primary') + '" id="glReady" style="width:100%" aria-pressed="' + ready + '">' +
        icon(ready ? 'check' : 'play') + (ready ? 'Ready — waiting for host' : 'I am ready') + '</button>' +
      '<div class="mp-note" style="text-align:center;margin-top:8px">' + esc(me.name) + ' · Seat ' + ((me.seat != null ? me.seat : 0) + 1) + '</div>';

    $('glBack').addEventListener('click', function () {
      Audio2.play('tap');
      mp.guest.leave(); mpReset();
      renderHome(); Nav.replace('scr-home', 'fade');
    });

    $('glReady').addEventListener('click', function () {
      Audio2.play('tap');
      mp.guest.setReady(!ready);
    });
  }

  function startGuestMatch(data) {
    mp.view = 'game';
    var cfg = data.cfg;
    cfg.netSeat = data.yourSeat;
    startMatch(cfg, data.st);
    var g = Game.active();
    g.netGuest = mp.guest;
    g.netSeq = data.seq || 1;
    g.legal = [];
    g.emit('hud');
  }

  function guestLost(why) {
    var g = Game.active();
    if (!g || !g.netGuest) { toast('Connection lost', 'info', 'people'); return; }
    updateNetChip('lost');
    var menu = $('pauseMenu');
    menu.classList.remove('hidden');
    menu.innerHTML =
      '<div class="action-sheet">' +
        '<div class="as-caption" style="padding:6px 0 2px">Connection lost' + (why ? ' · ' + esc(String(why).slice(0, 24)) : '') + '</div>' +
        '<div class="as-group"><div class="as-row" style="pointer-events:none">' +
          tile('t-gold', 'refresh') +
          '<span class="grow"><span class="t">You can rejoin</span><span class="s">Ask the host to re-invite your seat to reconnect.</span></span></div></div>' +
        '<button class="btn btn-primary as-primary" id="glLeave">Leave match</button>' +
      '</div>';

    $('glLeave').addEventListener('click', function () {
      menu.classList.add('hidden');
      mp.guest.leave(); mpReset();
      Game.destroy();
      renderHome(); Nav.replace('scr-home', 'fade');
    });
  }

  function guestClosedByHost(reason) {
    toast(reason === 'host-left' ? 'Host left — room closed' : 'Room closed', 'info', 'people');
    mpReset();
    Game.destroy();
    renderHome(); Nav.replace('scr-home', 'fade');
  }

  /* ---------- APP BOOT & EVENT BINDINGS ---------- */
  UI.init = function () {
    profile = Profile.loadProfile();
    Audio2.setEnabled(profile.settings.sound);
    Audio2.setMusic(profile.settings.music);
    Audio2.setHaptics(profile.settings.haptics);

    ['hud', 'boardWrap', 'board', 'diceDock', 'turnChip', 'diceBtn', 'pauseBtn'].forEach(function (id) {
      el[id] = $(id);
    });

    renderHome();
    show('scr-home', 'fade');

    var RENDERERS = {
      'scr-quick': renderQuick, 'scr-pass': renderPass, 'scr-profile': renderProfile,
      'scr-daily': renderDaily, 'scr-rules': renderRules, 'scr-settings': renderSettings
    };

    var st0 = null;
    try { st0 = history.state; } catch (e) {}
    if (st0 && st0.s && RENDERERS[st0.s]) {
      RENDERERS[st0.s]();
      show(st0.s, 'fade');
      navStack = ['scr-home', st0.s];
    } else {
      try { history.replaceState({ s: 'scr-home' }, ''); } catch (e) {}
    }

    window.addEventListener('popstate', onPopState);

    var edgeSwipe = null;
    document.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      var curId = currentScreen ? currentScreen.id : '';
      if (!PUSH_SCREENS[curId] || !Nav.canBack()) return;
      if (t.clientX > 30 || t.clientY < 70) return;
      edgeSwipe = { x: t.clientX, y: t.clientY, t: performance.now() };
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
      if (!edgeSwipe) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - edgeSwipe.x, dy = t.clientY - edgeSwipe.y, dt = performance.now() - edgeSwipe.t;
      edgeSwipe = null;
      if (dx > 55 && Math.abs(dy) < 46 && dt < 650) {
        Audio2.play('tap');
        Nav.back();
      }
    }, { passive: true });

    $('board').addEventListener('pointerdown', function (ev) {
      var g = Game.active();
      if (g) g.pointerDown(ev);
    });

    document.addEventListener('keydown', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Escape') {
        if (!$('pauseMenu').classList.contains('hidden')) {
          if (UI._closePause) UI._closePause();
          return;
        }
        if (currentScreen && currentScreen.id === 'scr-game') {
          var gp = Game.active();
          if (gp) openPause(gp, gp.cfg);
          return;
        }
        if (currentScreen && PUSH_SCREENS[currentScreen.id]) Nav.back();
        return;
      }
      if (currentScreen && currentScreen.id !== 'scr-game') return;
      var g = Game.active();
      if (!g) return;
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        Audio2.unlock();
        g.rollRequest();
      } else if (e.key >= '1' && e.key <= '4') {
        g.diceForSelection(+e.key);
      }
    });

    var unlock = function () {
      Audio2.unlock();
      document.removeEventListener('pointerdown', unlock);
    };
    document.addEventListener('pointerdown', unlock);

    document.addEventListener('visibilitychange', function () {
      var g = Game.active();
      if (!g || !$('scr-game').classList.contains('active')) return;
      if (document.hidden) {
        if ($('pauseMenu').classList.contains('hidden')) openPause(g, g.cfg);
      }
    });

    window.addEventListener('pagehide', function () {
      var g = Game.active();
      if (g) g.save();
    });

    window.addEventListener('resize', function () {
      var g = Game.active();
      if (g) g.resize();
    });
  };

  UI.refreshHome = function () { renderHome(); };
  UI.profile = function () { return profile; };
  UI.setInstallEvent = function (e) { installEvt = e; };
  UI.toast = toast;
  UI.show = show;
  UI.nav = Nav;
  UI._mpState = function () { return mp; };
  UI.reloadProfile = function () {
    profile = Profile.loadProfile();
    Audio2.setEnabled(profile.settings.sound);
    Audio2.setMusic(profile.settings.music);
    Audio2.setHaptics(profile.settings.haptics);
    if (currentScreen && (currentScreen.id === 'scr-home' || PUSH_SCREENS[currentScreen.id])) {
      var map = {
        'scr-home': renderHome,
        'scr-quick': renderQuick,
        'scr-pass': renderPass,
        'scr-profile': renderProfile,
        'scr-daily': renderDaily,
        'scr-rules': renderRules,
        'scr-settings': renderSettings,
        'scr-mp': renderMp
      };
      if (map[currentScreen.id]) map[currentScreen.id]();
    }
  };
  UI.goHome = function () {
    navStack = ['scr-home'];
    try { history.replaceState({ s: 'scr-home' }, ''); } catch (e) {}
    renderHome();
    show('scr-home', 'fade');
  };

  global.LudoraUI = UI;
})(window);

</script>
<script>
/* =========================================================================
   Ludora — main.js
   Bootstrap: init UI, register service worker, handle install prompt
   and safe update flow.
   ========================================================================= */
(function () {
  'use strict';

  function boot() {
    try {
      LudoraUI.init();
      /* reconcile the async IndexedDB copy with the localStorage mirror;
         if IDB turned out fresher, reload the profile behind the scenes */
      if (window.LudoraPersist) {
        LudoraPersist.hydrate().then(function (h) {
          if (h && h.fromIdb && h.replaced.length && window.LudoraUI.reloadProfile) {
            LudoraUI.reloadProfile();
          }
        }).catch(function () {});
      }
    } catch (e) {
      /* never leave the user with a blank screen */
      document.body.insertAdjacentHTML('beforeend',
        '<div style="position:fixed;inset:0;display:grid;place-items:center;background:#0B0C10;color:#F4F5F7;font:600 15px -apple-system,Roboto,sans-serif;text-align:center;padding:30px">Something went wrong starting the game.<br/>Reload to try again.</div>');
      return;
    }
    registerSW();
    hookInstall();
  }

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
    try {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        var handled = false;
        function offerUpdate() {
          if (handled) return;
          handled = true;
          LudoraUI.toast('Update ready — tap to restart', 'good', 'refresh');
          var t = document.getElementById('toasts').lastChild;
          if (t) {
            t.style.pointerEvents = 'auto';
            t.addEventListener('click', function () {
              try { reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
            });
          }
        }
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate();
          });
        });
        if (reg.waiting && navigator.serviceWorker.controller) offerUpdate();
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
      }).catch(function () { /* SW is an enhancement; game works regardless */ });
    } catch (e) { /* ignore */ }
  }

  function hookInstall() {
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      LudoraUI.setInstallEvent(e);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
